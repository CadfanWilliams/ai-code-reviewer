name: CI / CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Test & Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'azul'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build check (no tests atm)
        run: ./mvnw package -DskipTests

  deploy:
    name: Deploy
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Write .env file
        run: |
          cat > /opt/ai-code-reviewer/.env << EOF
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN_WEBHOOK }}
          EOF
          chmod 600 /opt/ai-code-reviewer/.env

      - name: Stop service
        run: sudo systemctl stop myapp

      - name: Pull & rebuild
        run: |
          cd /opt/myapp
          git pull origin main
          # Your build command here, e.g.:
          # npm ci && npm run build
          # pip install -r requirements.txt
          # go build -o bin/myapp .

      - name: Start service
        run: sudo systemctl start myapp

      - name: Health check
        run: |
          sleep 5
          systemctl is-active --quiet myapp && echo "Service is up" || exit 1
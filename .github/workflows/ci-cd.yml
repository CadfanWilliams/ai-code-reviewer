name: CI / CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Test & Build Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Run tests
        run: ./mvnw test

      - name: Build check (no tests, already ran above)
        run: ./mvnw package -DskipTests

  deploy:
    name: Deploy to Homelab
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Write .env file
        run: |
          cat > /opt/ai-code-reviewer/.env << EOF
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_KEY }}
          GITHUB_TOKEN=${{ secrets.PAT }}
          EOF
          chmod 600 /opt/ai-code-reviewer/.env

      - name: Stop service
        run: sudo systemctl stop ai-code-reviewer

      - name: Build fat JAR
        run: |
          cd /opt/ai-code-reviewer
          git pull origin main
          ./mvnw package -DskipTests

      - name: Start service
        run: sudo systemctl start ai-code-reviewer

      - name: Health check
        run: |
          sleep 8
          systemctl is-active --quiet ai-code-reviewer && echo "✅ Service is up" || (journalctl -u ai-code-reviewer --no-pager -n 30 && exit 1)